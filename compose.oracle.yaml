name: raven-oracle

services:
  app:
    build: .
    image: raven:oracle
    environment:
      ENV: prod
      STATIC_DIR: /app/static
      CORS_ORIGINS: ""
      TRUSTED_PROXY: "1"
      RATE_LIMIT_PER_MIN: "${RATE_LIMIT_PER_MIN:-120}"
      MAX_BODY_BYTES: "65536"
      ASSISTANT_PROVIDER: assistant-extractive
      ASSISTANT_DEV_RELOAD: "0"
      PIPELINE_DIR: ""
      EPHEMERIS_DIR: /app/build/ephemeris
      GRAZING_DEM_DIR: /app/build/lola
      GRAZING_DEM_ALLOW_DOWNLOAD: "1"
      GRAZING_DEM_CACHE_MAX_MB: "200"
      RAVEN_MAX_CONCURRENT: "2"
      RAVEN_CACHE_SIZE: "32"
      RAVEN_MAX_COMPUTE_SECONDS: "${RAVEN_MAX_COMPUTE_SECONDS:-120}"
      TELEMETRY_MAX_SUBSCRIBERS_PER_CLIENT: "${TELEMETRY_MAX_SUBSCRIBERS_PER_CLIENT:-3}"
      TELEMETRY_MAX_STREAM_SECONDS: "${TELEMETRY_MAX_STREAM_SECONDS:-300}"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    # Only the sanitizing proxy can reach this service through the backend network.
    # The separate outbound network permits NASA/PDS downloads, not inbound host access.
    command:
      - uvicorn
      - --factory
      - backend.bootstrap:build_app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
      - --no-access-log
    volumes:
      - lola:/app/build/lola
    networks:
      - backend
      - outbound
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 2
    mem_limit: 8g
    pids_limit: 256
    restart: unless-stopped
    logging: &bounded_logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    build:
      context: .
      dockerfile: deploy/oracle/nginx.Dockerfile
    image: raven-proxy:oracle
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RAVEN_LOCAL_PORT:-8080}:8080"
    volumes:
      - ./deploy/oracle/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
    networks:
      - ingress
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    logging: *bounded_logs

  tunnel:
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    user: "65532:65532"
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/tunnel_token
    depends_on:
      proxy:
        condition: service_healthy
    secrets:
      - tunnel_token
    networks:
      - ingress
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped
    logging: *bounded_logs

networks:
  ingress:
    ipam:
      config:
        - subnet: 172.30.86.0/28
  backend:
    internal: true
  outbound:

volumes:
  lola:

secrets:
  tunnel_token:
    file: "${TUNNEL_TOKEN_FILE:-./.secrets/cloudflare-tunnel-token}"
