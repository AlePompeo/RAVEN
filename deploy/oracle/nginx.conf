# SPDX-License-Identifier: Apache-2.0
server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 64k;

    # Only cloudflared and this proxy join the private Compose ingress subnet.
    # CF-Connecting-IP is overwritten by Cloudflare; client-supplied XFF is discarded.
    set_real_ip_from 172.30.86.0/28;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /api/train {
        default_type application/json;
        return 403 '{"detail":"Training is disabled on the public RAVEN deployment."}';
    }
    location ~ ^/api/jobs(/|$) {
        default_type application/json;
        return 403 '{"detail":"Training jobs are disabled on the public RAVEN deployment."}';
    }

    location / {
        set $raven_backend app:8000;
        proxy_pass http://$raven_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
